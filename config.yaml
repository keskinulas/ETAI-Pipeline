# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  drop_columns: ["id", "decile_score", "score_text"]  # identifiers / COMPAS's own score, not our model's inputs

diagnostics:
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", ""]
  numeric_text_columns: ["priors_count", "prior_offenses"]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    juv_misd_count: {min: 0}
    juv_other_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories:
    sex: {male: "Male", female: "Female"}
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      asian: "Asian"
      native american: "Native American"
      other: "Other"
    c_charge_degree: {f: "F", felony: "F", m: "M", misdemeanor: "M"}
    score_text: {low: "Low", medium: "Medium", high: "High"}
  id_column: "id"
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

test_set:
  size: 0.2
  random_state: 42

# Evaluate the entire recipe on development rows only; keep folds fixed for comparisons.
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "accuracy"
  n_jobs: 1

preprocessing:
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"
  encoder: "target"  # compact, target-informed encoding with internal cross-fitting
  scaler: "robust"   # median/IQR scaling for counts with extreme values
  random_state: 42

model:
  type: "decision_tree" # or "logistic_regression", "dummy", "random_forest"
  params: {random_state: 42}
  # For logistic regression, replace params with {max_iter: 1000}.


tuning:
  enabled: true
  n_trials: 30
  n_splits: 5
  random_state: 42
  search_spaces:
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    logistic_regression:
      model__C: {type: float, low: 0.0001, high: 100, log: true}

output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
